# Todos los valores sensibles llegan por variables de entorno (Render). No escribir llaves aquí.
spring.application.name=importador
server.port=${PORT:8080}

# Conexión a la base de datos PostgreSQL de Supabase
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.initialization-fail-timeout=-1

# Archivos de Excel de hasta 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Seguridad
importador.api-key=${IMPORTADOR_API_KEY:}
importador.origenes-permitidos=${ORIGENES_PERMITIDOS:http://localhost:5173}
